services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
      - node_modules:/var/www/html/node_modules
      - ./docker/php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      PHP_OPCACHE_VALIDATE_TIMESTAMPS: 1
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy

  web:
    image: nginx:1.30-alpine
    ports:
      - "8087:80"
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
      - node_modules:/var/www/html/node_modules
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy

  db:
    image: postgres:18-alpine
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-habaneando}
      POSTGRES_USER: ${POSTGRES_USER:-habaneando}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
    volumes:
      # Ab Postgres 18 liegt PGDATA unter /var/lib/postgresql/18/docker,
      # daher wird das übergeordnete Verzeichnis gemountet (neues Volume für v18).
      - pgdata18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-habaneando} -d ${POSTGRES_DB:-habaneando}"]
      interval: 10s
      timeout: 5s
      retries: 5

  vite:
    image: node:20-alpine
    working_dir: /var/www/html
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    environment:
      - CHOKIDAR_USEPOLLING=true
    ports:
      - "5173:5173"
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
      - node_modules:/var/www/html/node_modules
    depends_on:
      web:
        condition: service_started

volumes:
  vendor:
  node_modules:
  pgdata:      # alte Postgres-15-Daten, kann nach erfolgreicher Umstellung entfernt werden
  pgdata18:
